[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-soc-toolkit"
version = "0.1.0"
description = "Offline SSH authentication log analysis and brute-force alerts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

